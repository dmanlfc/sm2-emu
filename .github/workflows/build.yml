name: Build

# Builds sm2-emu on every push/PR to main (catches build breaks early) and
# packages release artifacts on every run: a Linux x86_64 AppImage + tarball,
# a Linux aarch64 AppImage + tarball, and a macOS dmg. Pushing a `v*` tag
# additionally publishes those five artifacts to a GitHub Release.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  # ---------------------------------------------------------------------
  # Linux x86_64 — software + OpenGL 4.3 desktop + Vulkan, packaged as an
  # AppImage.
  # ---------------------------------------------------------------------
  linux-x86_64:
    name: Linux x86_64 (AppImage + tarball)
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          # libsdl3-dev has no Ubuntu 24.04 package, so it's left out here on
          # purpose: CMake falls back to the vendored 3rdparty/SDL submodule,
          # same as any other Linux distro without a system SDL3.
          # (libvulkan-memory-allocator-dev is skipped for the same reason —
          # VMA is header-only and vendors just as easily.)
          sudo apt-get install -y \
            cmake ninja-build build-essential glslc \
            libgl-dev libgles-dev libegl-dev \
            libpugixml-dev libcurl4-openssl-dev \
            libvulkan-dev vulkan-validationlayers \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxss-dev libxrender-dev libxtst-dev \
            libasound2-dev libpulse-dev libudev-dev \
            libwayland-dev libwayland-bin libxkbcommon-dev libdecor-0-dev \
            ccache patchelf file desktop-file-utils

      - name: Cache ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-x86_64

      # SM2_BUILD_TESTS is forced OFF: tests/ is listed in .gitignore and was
      # never committed, so add_subdirectory(tests) has nothing to build on a
      # fresh clone (this affects every clone, not just CI). ctest is
      # therefore skipped here too. Drop this override once tests/ is tracked.
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSM2_BUILD_VULKAN=ON \
            -DSM2_BUILD_TESTS=OFF \
            -DSM2_LTO=ON

      - name: Build
        run: cmake --build build

      - name: Install into AppDir
        run: cmake --install build --prefix AppDir/usr

      - name: Build AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            --executable AppDir/usr/bin/sm2-emu \
            --desktop-file AppDir/usr/share/applications/sm2-emu.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/sm2-emu.png \
            --output appimage
          mkdir -p out
          mv "$(find . -maxdepth 1 -name '*.AppImage' ! -name 'linuxdeploy-*.AppImage')" out/sm2-emu-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: sm2-emu-linux-x86_64-appimage
          path: out/sm2-emu-x86_64.AppImage

      # A plain, non-AppImage package for anyone who'd rather just untar and
      # run against their own system libraries — a second, independent
      # `cmake --install` into its own directory, from the same build tree
      # already compiled above (no rebuild).
      - name: Install for tarball
        run: cmake --install build --prefix "sm2-emu-${VERSION}-linux-x86_64"

      - name: Build tarball
        run: |
          mkdir -p out
          tar czf "out/sm2-emu-${VERSION}-linux-x86_64.tar.gz" "sm2-emu-${VERSION}-linux-x86_64"

      - uses: actions/upload-artifact@v4
        with:
          name: sm2-emu-linux-x86_64-tarball
          path: out/sm2-emu-${{ env.VERSION }}-linux-x86_64.tar.gz

  # ---------------------------------------------------------------------
  # Linux aarch64 — software + OpenGL ES 3.1 + Vulkan, packaged as an
  # AppImage. Runs on a native arm64 hosted runner, so this is a normal
  # build rather than a cross-compile.
  # ---------------------------------------------------------------------
  linux-aarch64:
    name: Linux aarch64 (AppImage + tarball)
    runs-on: ubuntu-24.04-arm
    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build build-essential glslc \
            libgles-dev libegl-dev \
            libpugixml-dev libcurl4-openssl-dev \
            libvulkan-dev vulkan-validationlayers \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxss-dev libxrender-dev libxtst-dev \
            libasound2-dev libpulse-dev libudev-dev \
            libwayland-dev libwayland-bin libxkbcommon-dev libdecor-0-dev \
            ccache patchelf file desktop-file-utils

      - name: Cache ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-aarch64

      # SM2_BUILD_TESTS is forced OFF: tests/ is listed in .gitignore and was
      # never committed, so add_subdirectory(tests) has nothing to build on a
      # fresh clone (this affects every clone, not just CI). ctest is
      # therefore skipped here too. Drop this override once tests/ is tracked.
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSM2_BUILD_OPENGL_DESKTOP=OFF -DSM2_BUILD_OPENGL_ES=ON \
            -DSM2_BUILD_VULKAN=ON \
            -DSM2_BUILD_TESTS=OFF \
            -DSM2_LTO=ON

      - name: Build
        run: cmake --build build

      - name: Install into AppDir
        run: cmake --install build --prefix AppDir/usr

      - name: Build AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-aarch64.AppImage
          chmod +x linuxdeploy-aarch64.AppImage
          ./linuxdeploy-aarch64.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            --executable AppDir/usr/bin/sm2-emu \
            --desktop-file AppDir/usr/share/applications/sm2-emu.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/sm2-emu.png \
            --output appimage
          mkdir -p out
          mv "$(find . -maxdepth 1 -name '*.AppImage' ! -name 'linuxdeploy-*.AppImage')" out/sm2-emu-aarch64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: sm2-emu-linux-aarch64-appimage
          path: out/sm2-emu-aarch64.AppImage

      # A plain, non-AppImage package for anyone who'd rather just untar and
      # run against their own system libraries — a second, independent
      # `cmake --install` into its own directory, from the same build tree
      # already compiled above (no rebuild).
      - name: Install for tarball
        run: cmake --install build --prefix "sm2-emu-${VERSION}-linux-aarch64"

      - name: Build tarball
        run: |
          mkdir -p out
          tar czf "out/sm2-emu-${VERSION}-linux-aarch64.tar.gz" "sm2-emu-${VERSION}-linux-aarch64"

      - uses: actions/upload-artifact@v4
        with:
          name: sm2-emu-linux-aarch64-tarball
          path: out/sm2-emu-${{ env.VERSION }}-linux-aarch64.tar.gz

  # ---------------------------------------------------------------------
  # macOS (Apple Silicon) — Vulkan backend via MoltenVK, packaged as a dmg.
  # ---------------------------------------------------------------------
  macos:
    name: macOS (dmg)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install cmake ninja pkg-config ccache \
            shaderc sdl3 pugixml curl \
            vulkan-headers vulkan-loader molten-vk

      - name: Cache ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos-arm64

      # SM2_BUILD_TESTS is forced OFF: tests/ is listed in .gitignore and was
      # never committed, so add_subdirectory(tests) has nothing to build on a
      # fresh clone (this affects every clone, not just CI). ctest is
      # therefore skipped here too. Drop this override once tests/ is tracked.
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSM2_BUILD_VULKAN=ON \
            -DSM2_BUILD_TESTS=OFF \
            -DSM2_LTO=ON

      - name: Build
        run: cmake --build build

      - name: Install app bundle
        run: cmake --install build --prefix install

      - name: Build dmg
        run: |
          mkdir -p dmg-root
          cp -R install/sm2-emu.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "SM2 Emulator" -srcfolder dmg-root \
            -ov -format UDZO sm2-emu-macos.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: sm2-emu-macos-dmg
          path: sm2-emu-macos.dmg

  # ---------------------------------------------------------------------
  # Tag push only: gather the three artifacts above onto a GitHub Release.
  # ---------------------------------------------------------------------
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ linux-x86_64, linux-aarch64, macos ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/sm2-emu-linux-x86_64-appimage/*
            artifacts/sm2-emu-linux-x86_64-tarball/*
            artifacts/sm2-emu-linux-aarch64-appimage/*
            artifacts/sm2-emu-linux-aarch64-tarball/*
            artifacts/sm2-emu-macos-dmg/*
